<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASN Membership Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-box">
    <h2>ASN Membership Card</h2>
    <p>Enter your password to access your card.</p>
    <input id="password" type="password" placeholder="Password" autocomplete="off">
    <button id="loginBtn">Access card</button>
    <p id="error" class="error"></p>
  </div>
</div>

<main id="cardArea" class="hidden">
  <p class="hint">Click the card to flip</p>
  <div class="card" id="flipCard" tabindex="0" role="button">
    <div class="card-inner">
      <div class="card-face"><img id="frontImage" alt="Membership card front"></div>
      <div class="card-face card-back"><img id="backImage" alt="Membership card back"></div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
